version: 2.1
orbs:
  coveralls: coveralls/coveralls@2.2.5
  ruby: circleci/ruby@3.0.0
executors:
  allsearch-executor:
    docker:
      - image: cimg/ruby:3.4.10-browsers
        environment:
          APP_ENV: test
          ALLSEARCH_HOST: localhost
          AllSEARCH_USER: postgres
          SOLR_URL: http://solr:SolrRocks@localhost:8983/solr/allsearch-test
          COVERALLS_PARALLEL: true
      - image: cimg/postgres:15.4
        environment:
          POSTGRES_USER: allsearch
          POSTGRES_PASSWORD: allsearch
          POSTGRES_DB: allsearch_test
    working_directory: ~/allsearch_api  
jobs:
  staging_deploy:
    machine: true
    resource_class: pulibrary/ruby-deploy
    steps:
      - checkout
      - ruby/install-deps
      - run: bundle exec cap staging deploy
  staging_test:
    machine: true
    resource_class: pulibrary/ruby-deploy
    steps:
      - checkout
      - ruby/install-deps
      - run: APP_ENV=test bundle exec rspec smoke_spec/smoke_spec.rb
  build:
    docker:
      - image: cimg/ruby:3.4
    steps:
      - checkout
      - ruby/install-deps

  rubocop:
    docker: 
      - image: cimg/ruby:3.4
    steps:
      - checkout
      - ruby/install-deps
      - ruby/rubocop-check:
          format: progress
          label: Inspecting with Rubocop
  reek:
    docker:
      - image: cimg/ruby:3.4
    steps:
      - checkout
      - ruby/install-deps
      - run:
          name: Check code smells with Reek
          command: bundle exec reek app
  test:
    executor: allsearch-executor
    steps:
      - attach_workspace:
          at: '~/allsearch_api'
      - checkout
      - run: ruby --version
      - ruby/install-deps
      - run: sudo apt install postgresql-client
      - run:
          name: Wait for DB
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run:
          name: Database setup
          command: APP_ENV=test bundle exec rake db:migrate
      - ruby/install-deps
      - ruby/rspec-test:
          include: spec/**/*_spec.rb
          tag: ~@staging_test
      - coveralls/upload
  semgrep:
    docker:
        - image: returntocorp/semgrep
    steps:
      - checkout
      - run:
          name: Check code against community-provided and custom semgrep rules
          command: semgrep ci --config auto --config .semgrep.yml
  vacuum:
    executor: allsearch-executor
    steps:
      - attach_workspace:
          at: '~/allsearch_api'
      - checkout
      - run:
          name: Install vacuum
          command: npm install -g @quobix/vacuum --prefix=$HOME/.local
      - run:
          name: Validate swagger yaml file againt OpenAPI standard
          command: vacuum lint -d swagger/**/*.yaml

workflows:
  build_and_test:
    jobs:
      - build
      - rubocop
      - reek
      - test:
          requires:
            - build
      - staging_deploy:
          requires:
            - test
          filters:
           branches:
             only:
               - main
      - staging_test:
          requires:
            - staging_deploy
          filters:
            branches:
              only:
                - main
      - semgrep
      - vacuum
